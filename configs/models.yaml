    gguf_filename: "*.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "axelbrons Q5_K_S"

  - label: gemma4-e4b-axelbrons-q5km
    backend: llama_cpp
    gguf_repo: axelbrons/Gemma-4-E4B-it-Q5_K_M
    gguf_filename: "*.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "axelbrons Q5_K_M"

  - label: gemma4-e4b-axelbrons-q6k
    backend: llama_cpp
    gguf_repo: axelbrons/Gemma-4-E4B-it-Q6_K
    gguf_filename: "*.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
