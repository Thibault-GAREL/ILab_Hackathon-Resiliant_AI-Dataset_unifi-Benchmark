# =============================================================================
# Liste des modèles à benchmarker via scripts/bench_all.py.
#
# 2 backends supportés :
#   - transformers (défaut) : safetensors BF16 / AWQ
#   - llama_cpp             : GGUF via llama-cpp-python (image Docker fournie)
#
# `extras` indique une dépendance pip optionnelle à installer sur le pod
# avant de lancer ce modèle (cf. requirements.txt → autoawq, gptqmodel,
# compressed-tensors déjà inclus).
#
# Note bnb-4bit : retiré 2026-05-11 — bug FP4 init dans bitsandbytes pour
# Gemma 4 multimodal (assert module.weight.shape[1] == 1). Voir README pour
# le diagnostic complet. Les variantes AWQ couvrent déjà le cas 4-bit.
# =============================================================================

defaults:
  # Dataset source — override via CLI : --dataset_hub / --dataset_local
  dataset_hub: ECE-ILAB/resilient-ai-unified
  subsample_pct: 100
  country_iso: CZE         # data center Runpod EU-CZ-1 (Czech Republic)
                           # → CodeCarbon utilise le mix électrique tchèque
                           #   pour calculer les émissions CO2 du run
  split: test
  device: cuda
  max_new_tokens: 32

models:
  # =========================================================================
  # Backend transformers — safetensors
  # =========================================================================

  # ---- Plafond qualité ----------------------------------------------------
  - label: gemma4-e4b-bf16
    model_path: google/gemma-4-E4B-it
    notes: "Gemma 4 E4B-it BF16 — plafond qualité"

  - label: gemma4-e2b-bf16
    model_path: google/gemma-4-E2B-it
    notes: "Gemma 4 E2B-it BF16 — borne basse, 2x plus petit"

  # ---- AWQ (compresseur GPU-natif, formats compressed-tensors / gptqmodel)
  - label: gemma4-e4b-awq-chunity
    model_path: Chunity/gemma-4-E4B-it-AWQ-4bit
    extras: gptqmodel
    notes: "AWQ 4-bit Chunity"

  - label: gemma4-e4b-awq-cyankiwi-int4
    model_path: cyankiwi/gemma-4-E4B-it-AWQ-INT4
    extras: compressed-tensors
    notes: "AWQ INT4 cyankiwi"

  - label: gemma4-e4b-awq-cyankiwi-int8
    model_path: cyankiwi/gemma-4-E4B-it-AWQ-INT8
    extras: compressed-tensors
    notes: "AWQ INT8 cyankiwi — moins agressif, qualité meilleure attendue"

  # =========================================================================
  # Backend llama_cpp — GGUF (quantifications classiques bartowski imatrix)
  #
  # Les 4 quantifications "classiques" suffisent pour couvrir l'espace
  # qualité↔compression. Pour des régimes plus agressifs (IQ3, IQ2), ajouter
  # à la liste sur le même schéma.
  #
  # ⚠️ Le multimodal Gemma en llama.cpp est récent — vérifier que le mmproj
  # est bien co-localisé dans le repo et que la version installée de
  # llama-cpp-python le supporte.
  # =========================================================================

  # ---- E4B : grille complète des 4 quantifications classiques -------------
  - label: gemma4-e4b-gguf-q8
    backend: llama_cpp
    gguf_repo: bartowski/google_gemma-4-E4B-it-GGUF
    gguf_filename: "*Q8_0.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "GGUF Q8_0 (~8 GB) — quasi-lossless, sanity check qualité"

  - label: gemma4-e4b-gguf-q6km
    backend: llama_cpp
    gguf_repo: bartowski/google_gemma-4-E4B-it-GGUF
    gguf_filename: "*Q6_K.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "GGUF Q6_K (~6 GB) — compression douce"

  - label: gemma4-e4b-gguf-q4km
    backend: llama_cpp
    gguf_repo: bartowski/google_gemma-4-E4B-it-GGUF
    gguf_filename: "*Q4_K_M.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "GGUF Q4_K_M (~5 GB) — référence 4-bit de la communauté"

  - label: gemma4-e4b-gguf-iq4nl
    backend: llama_cpp
    gguf_repo: bartowski/google_gemma-4-E4B-it-GGUF
    gguf_filename: "*IQ4_NL.gguf"
    mmproj_repo: bartowski/google_gemma-4-E4B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "GGUF IQ4_NL (~5 GB) — imatrix non-linear, meilleur qualité/taille"

  # ---- E2B : borne basse en GGUF (juste Q4_K_M pour la comparaison) -------
  - label: gemma4-e2b-gguf-q4km
    backend: llama_cpp
    gguf_repo: bartowski/google_gemma-4-E2B-it-GGUF
    gguf_filename: "*Q4_K_M.gguf"
    mmproj_repo: bartowski/google_gemma-4-E2B-it-GGUF
    mmproj_filename: "mmproj-*f16.gguf"
    model_family: gemma4
    notes: "GGUF E2B Q4_K_M (~3 GB) — borne basse en taille"

# =============================================================================
# Hors scope :
#   - MLX (mlx-community/*) : Apple Silicon uniquement, pas Runpod.
#   - UQFF (mistralrs-community/*) : runtime mistral.rs séparé.
#   - bnb-4bit (unsloth/*-bnb-4bit) : bug FP4 transformers+bitsandbytes+
#     Gemma 4 multimodal (cf. README).
#   - Variantes fine-tunées communautaires (HauhauCS, Gemopus) : pas de
#     compressions vanilla, biaiseraient le benchmark.
# =============================================================================
