# =============================================================================
# Build et push de l'image Docker du benchmark sur GitHub Container Registry.
#
# Déclencheurs :
#   - push sur main/master quand Dockerfile, requirements ou code change
#   - workflow_dispatch (déclenchement manuel depuis l'onglet Actions)
#
# L'image est publiée sur :
#   ghcr.io/<user>/<repo>:latest
#   ghcr.io/<user>/<repo>:<short-sha>
#
# Sur Runpod : utiliser l'URL ghcr.io/<user>/<repo>:latest comme custom image.
# =============================================================================
name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'src/**'
      - 'scripts/**'
      - 'configs/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # L'image PyTorch + CUDA + llama-cpp-python fait ~10-15 GB. Le runner
      # ubuntu-latest a ~14 GB libres par défaut sur le disque ROOT, où
      # BuildKit écrit ses couches intermédiaires (/var/lib/buildkit/...).
      # `jlumbroso/free-disk-space` libère ~35 GB directement sur ce disque
      # en supprimant Android SDK, .NET, Haskell, CodeQL, large-packages, etc.
      # (plus efficace que easimon/maximize-build-space qui crée un volume
      # sur /mnt non utilisé par BuildKit par défaut).
      - name: Free Disk Space (Aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk space after cleanup
        run: |
          echo "## Disk space after cleanup ##"
          df -h
          echo ""
          echo "## Free space on / (used by BuildKit) ##"
          df -h / | tail -1 | awk '{print "Available: "$4}'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère automatiquement les tags + lowercase le nom du repo (GHCR
      # n'accepte que des noms en minuscules).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache GitHub Actions : la 1ère build prend ~30-45 min (apt + wheel
      # llama-cpp-python + pip install). Les suivantes ~3-5 min si seul le
      # code change (couches lourdes en cache).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags poussés sur GHCR :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour Runpod, utiliser :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository_owner }}/$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
