# =============================================================================
# Build et push de l'image Docker vLLM sur GHCR.
#
# Image publiée :
#   ghcr.io/<owner>/<repo>:phil-vllm-backend-vllm
# =============================================================================
name: Build and Push vLLM Docker Image

on:
  push:
    branches: [phil-vllm-backend]
    paths:
      - 'Dockerfile.vllm'
      - '.dockerignore'
      - 'requirements.txt'
      - 'src/**'
      - 'scripts/**'
      - 'configs/**'
      - '.github/workflows/docker-vllm.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-vllm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Move Docker data root to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          docker info | grep -E "Docker Root Dir|Storage Driver"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=phil-vllm-backend-vllm
            type=sha,prefix=vllm-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vLLM image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vllm
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vllm
          cache-to: type=gha,mode=max,scope=vllm

      - name: Image summary
        run: |
          {
            echo "## Image vLLM publiée"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "RunPod custom image :"
            echo '```'
            echo "ghcr.io/${{ github.repository }}:phil-vllm-backend-vllm" | tr '[:upper:]' '[:lower:]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
